<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AnchorTurtle</title>

  <!-- Favicon / Bookmark icon -->
  <link rel="icon" type="image/png" sizes="256x256" href="images/at-sea-trans-256.png">
  <link rel="apple-touch-icon" href="images/at-sea-trans-256.png">

  <!-- Open Graph / Social sharing defaults -->
  <meta property="og:title" content="AnchorTurtle">
  <meta property="og:description" content="Cosmic High-Fidelity Music Player by jestR">
  <meta property="og:image" content="images/at-sea-trans-256.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AnchorTurtle">

  <!-- Faster first paint: warm DNS/TLS for CDNs used below -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">

  <!-- Modular CSS first (critical path). ?v= busts stale device caches on deploy. -->
  <link rel="stylesheet" href="css/styles.css?v=20260927hd6">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body>
  <!-- BACKGROUND LAYERS -->
  <div id="space-bg"></div>
  <canvas id="space3d-canvas"></canvas>
  <canvas id="stars-canvas"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="grain-overlay"></div>

  <!-- Single native audio element. iOS lock-screen needs this path, not Web Audio. -->
  <audio id="audio-player" preload="metadata" playsinline></audio>

  <!-- PLANET FOCAL TEXT (the planet itself is rendered live in 3D behind this) -->
  <div id="planet-bg" style="position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none">
    <div class="focal-orbit" style="position:relative">
      <div class="focal-backdrop"></div>
      <div class="planet-fallback-glow"></div>
      <div class="focal-text" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:32px">
        <p class="tape-counter phosphor focal-eyebrow" style="margin-bottom:10px">NOW PLAYING</p>
        <h2 id="focal-title" class="focal-title">—</h2>
        <p id="focal-artist" class="phosphor focal-artist">Select a track</p>
      </div>
    </div>
  </div>

  <!-- TRACKLIST WINDOW -->
  <div id="tracklist-win" class="win" style="display:none;z-index:320">
    <div class="win-resize nw" data-dir="nw"></div><div class="win-resize ne" data-dir="ne"></div>
    <div class="win-resize sw" data-dir="sw"></div><div class="win-resize se" data-dir="se"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-bar" id="tracklist-bar">
      <div class="win-bar-left">
        <span class="material-symbols-outlined" style="font-size:12px;color:rgba(150,100,255,.5)">drag_indicator</span>
        <span class="win-title">Tracklist</span>
        <span class="tape-counter" id="track-count" style="opacity:.6"></span>
      </div>
      <div class="win-bar-right">
        <button class="win-close" id="close-tracklist" title="Close"><span class="material-symbols-outlined">close</span></button>
      </div>
    </div>
    <div class="win-body" style="padding:10px 8px 10px;gap:8px">
      <!-- Category tabs for tracklist -->
      <div class="tracklist-tabs">
        <button class="tab active" data-category="all" aria-label="All">
          <span class="tab-short">All</span><span class="tab-full">All</span>
        </button>
        <button class="tab" data-category="rap" aria-label="Raps">
          <span class="tab-short">Raps</span><span class="tab-full">Raps</span>
        </button>
        <button class="tab" data-category="instrumental" aria-label="Instrumental">
          <span class="tab-short">Inst</span><span class="tab-full">Instrumental</span>
        </button>
        <button class="tab" data-category="albums" aria-label="Albums">
          <span class="tab-short">Albums</span><span class="tab-full">Albums</span>
        </button>
        <button class="tab" data-category="ai" aria-label="AI">
          <span class="tab-short">AI</span><span class="tab-full">AI</span>
        </button>
      </div>
      <div style="padding:0 4px">
        <div class="search-wrap">
          <span class="material-symbols-outlined">search</span>
          <input id="search-input" placeholder="Search tracks…" type="text" autocomplete="off"/>
        </div>
      </div>
      <!-- drop-line lives INSIDE the tracklist body so it is clipped to window width -->
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0 4px;position:relative" class="no-scrollbar" id="sidebar-tracklist">
        <div id="drop-line"></div>
      </div>
    </div>
  </div>

  <!-- TOUCH SWIPE LAYER (mobile/tablet: swipe the planet to change track) -->
  <div id="planet-swipe-layer" aria-hidden="true"></div>

  <!-- Rest of Orbit HTML truncated in this push attempt - SEE NOTE -->
</body>
</html>
