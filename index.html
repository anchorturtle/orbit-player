<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <script>
    /* Mobile: block page pinch/gesture zoom; allow only inside image native fullscreen. */
    (function () {
      function imgFs() {
        try {
          var a = document.fullscreenElement || document.webkitFullscreenElement;
          return !!(a && a.id === 'image-win');
        } catch (e) { return false; }
      }
      function block(e) {
        if (!imgFs()) e.preventDefault();
      }
      document.addEventListener('gesturestart', block, { passive: false, capture: true });
      document.addEventListener('gesturechange', block, { passive: false, capture: true });
      document.addEventListener('gestureend', block, { passive: false, capture: true });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1 && !imgFs()) e.preventDefault();
      }, { passive: false, capture: true });
    })();
  </script>
