<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AnchorTurtle</title>

  <!-- Favicon / Bookmark icon -->
  <link rel="icon" type="image/png" sizes="256x256" href="images/at-sea-trans-256.png">
  <link rel="apple-touch-icon" href="images/at-sea-trans-256.png">

  <!-- Open Graph / Social sharing defaults -->
  <meta property="og:title" content="AnchorTurtle">
  <meta property="og:description" content="Cosmic High-Fidelity Music Player by jestR">
  <meta property="og:image" content="images/at-sea-trans-256.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AnchorTurtle">

  <!-- Tailwind via CDN (kept for zero-build workflow) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Modular CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Tailwind runtime config -->
  <script id="tc">tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{headline:["Plus Jakarta Sans"],body:["Plus Jakarta Sans"]}}}}</script>
</head>
<body>
  <!-- BACKGROUND LAYERS -->
  <div id="space-bg"></div>
  <canvas id="stars-canvas"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="grain-overlay"></div>

  <!-- AUDIO ELEMENT -->
  <audio id="audio-player" preload="auto" playsinline></audio>

  <!-- PLANET (focal visual) -->
  <div id="planet-bg" style="position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none">
    <div style="position:relative;width:320px;height:320px">
      <div class="planet-glow" style="position:absolute;inset:0;border-radius:50%"></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;height:520px;border-radius:50%;border:1px solid rgba(45,91,255,.07)" class="ring-far"></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:340px;height:340px;border-radius:50%;border:1px solid rgba(123,47,255,.09)" class="ring-near"></div>
      <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;background:rgba(15,10,35,.32);backdrop-filter:blur(18px);border:1px solid rgba(123,47,255,.14)">
        <div style="width:100%;height:100%;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 0);background-size:12px 12px;opacity:.18"></div>
      </div>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:32px">
        <p class="tape-counter phosphor" style="margin-bottom:10px">NOW PLAYING</p>
        <h2 id="focal-title" style="font-size:2.4rem;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1;color:#e9e1de;text-shadow:0 0 40px rgba(123,47,255,.5);margin-bottom:10px">—</h2>
        <p id="focal-artist" class="phosphor" style="font-size:9px;font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:var(--jestr-green)">Select a track</p>
      </div>
    </div>
  </div>

  <!-- TRACKLIST WINDOW -->
  <div id="tracklist-win" class="win" style="display:none;z-index:320">
    <div class="win-resize nw" data-dir="nw"></div><div class="win-resize ne" data-dir="ne"></div>
    <div class="win-resize sw" data-dir="sw"></div><div class="win-resize se" data-dir="se"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-bar" id="tracklist-bar">
      <div class="win-bar-left">
        <span class="material-symbols-outlined" style="font-size:12px;color:rgba(150,100,255,.5)">drag_indicator</span>
        <span class="win-title">Tracklist</span>
        <span class="tape-counter" id="track-count" style="opacity:.6"></span>
      </div>
      <div class="win-bar-right">
        <button class="win-close" id="close-tracklist" title="Close"><span class="material-symbols-outlined" style="font-size:11px">close</span></button>
      </div>
    </div>
    <div class="win-body" style="padding:10px 8px 10px;gap:8px">
      <div style="padding:0 4px">
        <div class="search-wrap">
          <span class="material-symbols-outlined">search</span>
          <input id="search-input" placeholder="Search tracks…" type="text" autocomplete="off"/>
        </div>
      </div>
      <!-- drop-line lives INSIDE the tracklist body so it is clipped to window width -->
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0 4px;position:relative" class="no-scrollbar" id="sidebar-tracklist">
        <div id="drop-line"></div>
      </div>
    </div>
  </div>

  <!-- GALLERY WINDOW -->
  <div id="gallery-win" class="win" style="display:none;z-index:310">
    <div class="win-resize nw" data-dir="nw"></div><div class="win-resize ne" data-dir="ne"></div>
    <div class="win-resize sw" data-dir="sw"></div><div class="win-resize se" data-dir="se"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-bar" id="gallery-bar">
      <div class="win-bar-left">
        <span class="material-symbols-outlined" style="font-size:12px;color:rgba(150,100,255,.5)">drag_indicator</span>
        <span class="win-title">Gallery</span>
      </div>
      <div class="win-bar-right">
        <button class="win-close" id="close-gallery" title="Close"><span class="material-symbols-outlined" style="font-size:11px">close</span></button>
      </div>
    </div>
    <div class="win-body" style="padding:10px;">
      <!-- Use the exact same scroller pattern as the tracklist (#sidebar-tracklist) -->
      <div style="flex:1; overflow-y:auto; display:block; padding:0 6px 0 0; position:relative" class="no-scrollbar" id="gallery-scroll-container">
        <div class="gallery-grid" id="gw-grid"></div>
      </div>
    </div>
  </div>

  <!-- PLAYER WINDOW -->
  <div id="player-win" class="win" style="display:none;z-index:330">
    <div class="win-resize nw" data-dir="nw"></div><div class="win-resize ne" data-dir="ne"></div>
    <div class="win-resize sw" data-dir="sw"></div><div class="win-resize se" data-dir="se"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-bar" id="player-bar">
      <div class="win-bar-left">
        <span class="material-symbols-outlined" style="font-size:12px;color:rgba(150,100,255,.5)">drag_indicator</span>
        <span class="win-title">Orbit Player</span>
      </div>
      <div class="win-bar-right">
        <button class="win-close" id="close-player" title="Close"><span class="material-symbols-outlined" style="font-size:11px">close</span></button>
      </div>
    </div>
    <div class="win-body" style="padding:10px 14px 12px;overflow:visible">
      <!-- Cleaner, better-centered metadata header -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div id="fp-art" style="width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(123,47,255,.22);border:1px solid rgba(123,47,255,.35);box-shadow:0 0 16px rgba(123,47,255,.25),inset 0 1px 0 rgba(255,255,255,.1)">
          <span class="material-symbols-outlined" style="font-size:20px;color:var(--jestr-purple);font-variation-settings:'FILL' 1">music_note</span>
        </div>
        
        <!-- Centered track info -->
        <div style="flex:1; min-width:0; text-align: center;">
          <p id="fp-title" style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#e9e1de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0">No Track</p>
          <p id="fp-artist" class="phosphor" style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--jestr-green);margin:1px 0 0">&mdash;</p>
        </div>

        <!-- Action buttons (now compact icon-only) -->
        <div style="display:flex; gap:4px; flex-shrink:0;">
          <button id="btn-download" class="ctrl-btn" style="padding:6px" title="Download">
            <span class="material-symbols-outlined" style="font-size:15px">download</span>
          </button>
          <button id="btn-info" class="ctrl-btn" style="padding:6px" title="More details / song page">
            <span class="material-symbols-outlined" style="font-size:15px">info</span>
          </button>
          <button id="btn-share" class="ctrl-btn" style="padding:6px" title="Copy shareable link">
            <span class="material-symbols-outlined" style="font-size:15px">share</span>
          </button>
        </div>
      </div>
      <div class="player-controls">
        <button id="btn-shuffle" class="ctrl-btn" title="Shuffle"><span class="material-symbols-outlined" style="font-size:16px">shuffle</span></button>
        <button id="btn-prev" class="ctrl-btn" title="Prev"><span class="material-symbols-outlined" style="font-size:18px">skip_previous</span></button>
        <button id="btn-back10" class="ctrl-btn" title="-10s"><span class="material-symbols-outlined" style="font-size:17px">replay_10</span></button>
        <button id="btn-play" class="play-btn" style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span id="play-icon" class="material-symbols-outlined text-white" style="font-size:24px;font-variation-settings:'FILL' 1">play_arrow</span>
        </button>
        <button id="btn-fwd10" class="ctrl-btn" title="+10s"><span class="material-symbols-outlined" style="font-size:17px">forward_10</span></button>
        <button id="btn-next" class="ctrl-btn" title="Next"><span class="material-symbols-outlined" style="font-size:18px">skip_next</span></button>
        <button id="btn-repeat" class="ctrl-btn" title="Repeat"><span id="repeat-icon" class="material-symbols-outlined" style="font-size:16px">repeat</span></button>
      </div>
      <!-- Unified, better-centered timeline + volume area -->
      <div style="display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;margin-top:4px">
        <span id="time-current" class="tape-counter" style="width:28px;flex-shrink:0;font-size:8px">0:00</span>
        
        <div class="progress-wrap" id="progress-rail" style="flex:1">
          <div class="progress-track-bg"></div>
          <div class="progress-fill-bar" id="progress-fill" style="width:0%"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        
        <span id="time-total" class="tape-counter" style="width:28px;flex-shrink:0;text-align:right;font-size:8px">0:00</span>
        
        <div style="width:1px;height:14px;background:rgba(255,255,255,.12);margin:0 4px;"></div>
        
        <div class="vol-row" style="margin:0; padding:2px 6px; background:transparent; border:none;">
          <div id="vol-icon-wrap" title="Mute/Unmute" style="width:26px;height:26px;">
            <span id="vol-icon" class="material-symbols-outlined" style="font-size:13px">volume_up</span>
          </div>
          <input type="range" id="vol-slider" min="0" max="100" value="80" step="1" style="width:90px;"/>
          <span class="tape-counter" id="vol-pct" style="width:24px;font-size:7px;">80%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- IMAGE VIEWER WINDOW -->
  <div id="image-win" class="win" style="z-index:500">
    <div class="win-resize nw" data-dir="nw"></div><div class="win-resize ne" data-dir="ne"></div>
    <div class="win-resize sw" data-dir="sw"></div><div class="win-resize se" data-dir="se"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-bar" id="image-win-bar">
      <div class="win-bar-left">
        <span class="material-symbols-outlined" style="font-size:12px;color:rgba(150,100,255,.5)">drag_indicator</span>
      </div>
      <div class="win-bar-right">
        <button class="win-close" id="close-image-win" title="Close"><span class="material-symbols-outlined" style="font-size:11px">close</span></button>
      </div>
    </div>
    <div class="win-body" style="align-items:center;justify-content:center;background:rgba(3,2,10,.5);padding:10px;overflow:hidden">
      <img id="image-win-img" src="" alt="" style="max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;display:block;position:relative;z-index:1"/>
      <div class="img-nav img-nav-prev" id="img-nav-prev"><span class="material-symbols-outlined img-nav-icon">chevron_left</span></div>
      <div class="img-nav img-nav-next" id="img-nav-next"><span class="material-symbols-outlined img-nav-icon">chevron_right</span></div>
    </div>
  </div>

  <!-- SONG DETAIL WINDOW -->
  <div id="song-detail-win" class="win" style="display:none; min-width:320px; min-height:380px; z-index:340">
    <div class="win-resize nw" data-dir="nw"></div><div class="win-resize ne" data-dir="ne"></div>
    <div class="win-resize sw" data-dir="sw"></div><div class="win-resize se" data-dir="se"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-bar" id="song-detail-bar">
      <div class="win-bar-left">
        <span class="material-symbols-outlined" style="font-size:12px;color:rgba(150,100,255,.5)">drag_indicator</span>
        <span class="win-title" id="song-detail-title-bar">Track Info</span>
      </div>
      <div class="win-bar-right">
        <button class="win-close" id="close-song-detail" title="Close"><span class="material-symbols-outlined" style="font-size:11px">close</span></button>
      </div>
    </div>
    <div class="win-body" style="padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:18px;">
      
      <!-- Header / Artwork -->
      <div style="display:flex; gap:16px; align-items:flex-start;">
        <div id="song-detail-art" 
             style="width:110px;height:110px;flex-shrink:0;border-radius:14px;background:rgba(123,47,255,.12);border:1px solid rgba(123,47,255,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 20px rgba(123,47,255,.15);">
          <span class="material-symbols-outlined" style="font-size:42px;color:var(--jestr-purple);font-variation-settings:'FILL' 1">music_note</span>
        </div>

        <div style="flex:1; min-width:0; padding-top:4px;">
          <div id="song-detail-year" style="font-size:10px; font-weight:700; letter-spacing:.15em; color:var(--jestr-green); text-transform:uppercase; margin-bottom:4px;"></div>
          <h2 id="song-detail-title" style="font-size:17px; font-weight:800; line-height:1.15; margin:0 0 3px; color:#e9e1de;"></h2>
          <p id="song-detail-artist" class="phosphor" style="font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--jestr-green); margin:0;"></p>
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button id="song-detail-play" class="play-btn" style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span class="material-symbols-outlined text-white" style="font-size:30px;font-variation-settings:'FILL' 1">play_arrow</span>
        </button>
        
        <button id="song-detail-download" class="ctrl-btn" style="padding:8px 16px; display:flex; align-items:center; gap:6px;">
          <span class="material-symbols-outlined" style="font-size:17px">download</span>
          <span style="font-size:11px; font-weight:700; letter-spacing:.5px;">Download</span>
        </button>
        
        <button id="song-detail-share" class="ctrl-btn" title="Copy shareable link">
          <span class="material-symbols-outlined" style="font-size:16px">share</span>
          <span style="font-size:11px; font-weight:600;">Share</span>
        </button>
      </div>

      <!-- Description -->
      <div id="song-detail-description" 
           style="font-size:11px; line-height:1.5; color:rgba(233,225,222,.75); background:rgba(255,255,255,0.03); padding:12px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.06);">
      </div>

      <!-- Meta / Credits -->
      <div id="song-detail-meta" 
           style="font-size:10px; color:rgba(233,225,222,.55); display:flex; flex-wrap:wrap; gap:12px 18px; padding-top:4px;">
        <!-- Populated dynamically by JS -->
      </div>

    </div>
  </div>

  <!-- DESKTOP DOCK -->
  <div id="dock-win" class="win">
    <div class="win-body">
      <div class="dock-logo-wrap">
        <span class="dock-logo-main vhs-flicker phosphor">Orbit</span>
        <span class="dock-logo-sub">Hi-Fi</span>
      </div>
      <div class="dock-divider"></div>
      <button class="taskbar-btn win-open" id="btn-tracklist" onclick="toggleWin('tracklist-win','btn-tracklist')">
        <span class="material-symbols-outlined">library_music</span>
        <span>Tracks</span>
        <div class="taskbar-dot"></div>
      </button>
      <button class="taskbar-btn win-open" id="btn-gallery" onclick="toggleWin('gallery-win','btn-gallery')">
        <span class="material-symbols-outlined">photo_library</span>
        <span>Gallery</span>
        <div class="taskbar-dot"></div>
      </button>
      <button class="taskbar-btn win-open" id="btn-player" onclick="toggleWin('player-win','btn-player')">
        <span class="material-symbols-outlined">equalizer</span>
        <span>Player</span>
        <div class="taskbar-dot"></div>
      </button>
    </div>
  </div>

  <!-- MOBILE DOCK -->
  <div id="mobile-dock">
    <button class="mob-btn active" id="btn-mob-tracks" onclick="mobToggle('tracklist-win','btn-mob-tracks')">
      <span class="material-symbols-outlined">queue_music</span>
      <span>Tracks</span>
      <div class="mob-dot"></div>
    </button>
    <button class="mob-btn active" id="btn-mob-player" onclick="mobToggle('player-win','btn-mob-player')">
      <span class="material-symbols-outlined">play_circle</span>
      <span>Player</span>
      <div class="mob-dot"></div>
    </button>
    <button class="mob-btn" id="btn-mob-gallery" onclick="mobToggle('gallery-win','btn-mob-gallery')">
      <span class="material-symbols-outlined">image</span>
      <span>Gallery</span>
      <div class="mob-dot"></div>
    </button>
  </div>

  <!-- SCRIPT IMPORTS (order matters for dependencies) -->
  <script src="js/utils.js"></script>
  <script src="js/player.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
