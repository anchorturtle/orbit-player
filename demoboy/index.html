  <style>
    :root {
      --bg: #0b070d;
      --text: #e9e1de;
      --muted: rgba(233, 225, 222, .74);
      --green: #00C896;
      --purple: #7B2FFF;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 20px 48px;
    }
    @media (min-height: 760px) {
      body { justify-content: center; }
    }
    .wrap {
      width: min(520px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .hero {
      position: relative;
      width: min(300px, 72vw);
      aspect-ratio: 1;
      margin: 0 0 8px;
      overflow: hidden;
    }
    .hero img, .hero video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hero img.hero-still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .hero img.hero-anim { display: none; }
      .hero img.hero-still { display: block; }
    }
    h1 {
      margin: 8px 0 0;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #e9e1de;
    }
    .meta {
      margin: 8px 0 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--green);
    }
    .desc {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 36em;
    }
    .play {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 22px;
      padding: 11px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(123, 47, 255, .28), rgba(45, 91, 255, .20));
      border: 1px solid rgba(123, 47, 255, .48);
      color: #e9e1de;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .12);
      transition: background .16s ease, border-color .16s ease, transform .14s ease;
    }
    .play:hover, .play:focus-visible {
      background: linear-gradient(135deg, rgba(123, 47, 255, .42), rgba(0, 200, 150, .24));
      border-color: rgba(0, 200, 150, .55);
      color: #fff;
    }
    .play:active { transform: scale(.96); }
    .play .material-symbols-outlined { font-size: 18px; }
    .home {
      margin-top: 22px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      color: rgba(233, 225, 222, .42);
      text-decoration: none;
    }
    .home:hover, .home:focus-visible { color: rgba(126, 200, 227, .85); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="hero">
      <img class="hero-anim" src="logo.webp" alt="DemoBoy" width="640" height="640"/>
      <img class="hero-still" src="logo.png" alt="DemoBoy" width="800" height="800"/>
    </div>
    <h1>DemoBoy: The Madness Within</h1>
    <p class="meta">Action / Adventure · Spawn</p>
    <p class="desc">Swing, grind, dive, and unleash beast mode across Arcadya.</p>
    <a class="play" href="https://www.spawn.co/@anchorturtle/demoboy-the-madness-within" target="_blank" rel="noopener noreferrer">
      <span class="material-symbols-outlined">play_arrow</span>
      <span>Play on Spawn</span>
    </a>
    <a class="home" href="/">AnchorTurtle</a>
  </main>
</body>
</html>
